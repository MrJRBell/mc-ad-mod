name: AdvertiseMod
version: '${project.version}'
main: com.advertisemod.AdvertisePlugin
api-version: '1.20'
folia-supported: true
description: AdvertiseMod Shopping District Barrel Advertising & Web Indexer Plugin
author: AdvertiseMod Team

commands:
  advertise:
    description: Advertise and manage shopping district sales barrels
    aliases: [adv]
    usage: /advertise <help|start|stop|status|admin|setFairMarketPrice>

permissions:
  advertisemod.use:
    description: Allows players to register and manage their advertised shop barrels
    default: true
  advertisemod.admin:
    description: Allows server administrators to manage shop limits, boundaries, and listings
    default: op

libraries:
  - org.xerial:sqlite-jdbc:3.45.1.0

